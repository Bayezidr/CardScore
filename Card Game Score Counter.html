<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ace Scorer - Premium Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');
        
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --gold: #f59e0b;
        }

        body { 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            font-family: 'Hind Siliguri', sans-serif; 
            min-height: 100vh;
            color: #1e293b;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }

        .playing-card-shape {
            position: absolute;
            opacity: 0.04;
            z-index: 0;
            pointer-events: none;
        }

        .score-card {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .active-win { 
            background: var(--success) !important; 
            color: white !important; 
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
            border-color: #059669 !important;
        }

        .active-loss { 
            background: var(--danger) !important; 
            color: white !important; 
            box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
            border-color: #dc2626 !important;
        }

        .winner-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .history-table th { 
            font-size: 12px; 
            font-weight: 800;
            color: #64748b; 
            padding: 16px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <!-- Decorative Card Shapes -->
    <i class="fas fa-heart playing-card-shape text-[20rem] -top-20 -left-20 text-red-600" style="animation: float 8s infinite"></i>
    <i class="fas fa-spade playing-card-shape text-[15rem] top-1/2 -right-20 text-slate-900" style="animation: float 6s infinite reverse"></i>

    <!-- Winner Modal -->
    <div id="winner-modal" class="winner-modal">
        <div class="glass-panel p-10 text-center max-w-sm border-2 border-amber-400">
            <div class="text-6xl mb-4">👑</div>
            <h2 class="text-3xl font-black mb-2">গেম বিজয়ী!</h2>
            <p id="winner-name" class="text-2xl font-bold text-blue-600 mb-8"></p>
            <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-black transition">রিস্টার্ট গেম</button>
        </div>
    </div>

    <div class="max-w-5xl mx-auto relative z-10">
        <!-- Header -->
        <div class="flex items-center justify-between mb-10">
            <div>
                <h1 class="text-3xl font-black tracking-tighter">CARD <span class="text-blue-600">MASTER</span></h1>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Winning Target: 50 Points</p>
            </div>
            <div class="flex gap-3">
                <div class="w-12 h-12 glass-panel flex items-center justify-center text-rose-500 shadow-sm"><i class="fas fa-heart text-xl"></i></div>
                <div class="w-12 h-12 glass-panel flex items-center justify-center text-slate-800 shadow-sm"><i class="fas fa-spade text-xl"></i></div>
            </div>
        </div>

        <!-- Setup -->
        <div id="setup-section" class="glass-panel p-10 text-center max-w-md mx-auto">
            <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-users text-blue-600 text-3xl"></i>
            </div>
            <h3 class="text-xl font-bold mb-6">প্লেয়ার মোড নির্বাচন করুন</h3>
            <select id="player-mode" class="w-full p-4 mb-6 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold appearance-none text-center">
                <option value="2">২ পক্ষ (টিম বনাম টিম)</option>
                <option value="4">৪ পক্ষ (ব্যক্তিগত)</option>
            </select>
            <button onclick="startGame()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">শুরু করুন</button>
        </div>

        <!-- Game Interface -->
        <div id="game-area" class="hidden space-y-8">
            <!-- Names Configuration -->
            <div id="names-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>

            <!-- Dashboard -->
            <div id="score-dashboard" class="grid grid-cols-2 md:grid-cols-4 gap-5"></div>

            <!-- Entry Panel -->
            <div class="glass-panel p-6 md:p-10 border-t-4 border-blue-600">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-xl font-black"><i class="fas fa-edit mr-2 text-blue-500"></i>স্কোর ইনপুট</h2>
                    <span id="round-indicator" class="text-xs font-black bg-slate-900 text-white px-4 py-1 rounded-full">ROUND 1</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="space-y-2">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-wider ml-1">বিডার</label>
                        <select id="bidder-select" onchange="updateLabels()" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none font-bold"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-wider ml-1">বিড পয়েন্ট</label>
                        <select id="bid-type" onchange="updateOppTarget()" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none font-bold">
                            <option value="7">৭ পয়েন্ট</option>
                            <option value="8">৮ পয়েন্ট</option>
                            <option value="13">১৩ পয়েন্ট (Golden)</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-wider ml-1">বিপক্ষ টার্গেট</label>
                        <div id="opp-target-box" class="p-4 bg-slate-100 text-slate-700 font-black rounded-2xl text-center border-2 border-dashed border-slate-300">৪ পয়েন্ট</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                    <div class="space-y-4">
                        <p id="bidder-label" class="font-bold text-slate-600 text-sm"><i class="fas fa-crown text-amber-500 mr-1"></i> বিডার পক্ষ</p>
                        <div class="flex gap-4">
                            <button onclick="setResult('bidder', true)" id="b-win" class="flex-1 py-4 rounded-2xl bg-white border border-slate-200 text-emerald-600 font-bold hover:bg-emerald-50 transition">সফল</button>
                            <button onclick="setResult('bidder', false)" id="b-loss" class="flex-1 py-4 rounded-2xl bg-white border border-slate-200 text-rose-600 font-bold hover:bg-rose-50 transition">অসফল</button>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <p id="opponent-label" class="font-bold text-slate-600 text-sm"><i class="fas fa-shield-alt text-blue-500 mr-1"></i> বিপক্ষ</p>
                        <div class="flex gap-4">
                            <button onclick="setResult('opponent', true)" id="o-win" class="flex-1 py-4 rounded-2xl bg-white border border-slate-200 text-emerald-600 font-bold hover:bg-emerald-50 transition">সফল</button>
                            <button onclick="setResult('opponent', false)" id="o-loss" class="flex-1 py-4 rounded-2xl bg-white border border-slate-200 text-rose-600 font-bold hover:bg-rose-50 transition">অসফল</button>
                        </div>
                    </div>
                </div>

                <button onclick="submitScores()" class="w-full mt-12 bg-slate-900 text-white py-5 rounded-2xl font-black text-lg hover:shadow-2xl transition-all active:scale-[0.98]">পয়েন্ট আপডেট করুন</button>
            </div>

            <!-- History Section -->
            <div class="glass-panel overflow-hidden">
                <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
                    <h3 class="font-black text-slate-700 tracking-tight"><i class="fas fa-history mr-2"></i> পয়েন্ট হিস্ট্রি</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left history-table">
                        <thead>
                            <tr class="bg-white/50">
                                <th class="px-6">রাউন্ড</th>
                                <th class="px-6">বিডার তথ্য</th>
                                <th class="px-6">ফলাফল</th>
                                <th class="px-6 text-blue-600">মোট পয়েন্ট</th>
                            </tr>
                        </thead>
                        <tbody id="history-log" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mode = 2;
        let teams = [];
        let roundNo = 1;
        let bSuccess = null;
        let oSuccess = null;

        function startGame() {
            mode = parseInt(document.getElementById('player-mode').value);
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            initTeams();
        }

        function initTeams() {
            const grid = document.getElementById('names-grid');
            grid.innerHTML = '';
            for (let i = 0; i < mode; i++) {
                let name = mode == 2 ? `Team ${String.fromCharCode(65+i)}` : `Player ${i+1}`;
                teams.push({ id: i, name: name, score: 0 });
                grid.innerHTML += `<input type="text" value="${name}" oninput="updateName(${i}, this.value)" class="p-3 bg-white border border-slate-200 rounded-xl text-center font-bold outline-none focus:ring-2 focus:ring-blue-400 text-sm shadow-sm">`;
            }
            refresh();
        }

        function updateName(id, val) { teams[id].name = val; refresh(); }

        function refresh() {
            const dashboard = document.getElementById('score-dashboard');
            const select = document.getElementById('bidder-select');
            const currentSelect = select.value;
            dashboard.innerHTML = ''; select.innerHTML = '';

            teams.forEach(t => {
                const isWarning = t.score >= 40;
                dashboard.innerHTML += `
                    <div class="glass-panel p-6 text-center score-card ${isWarning ? 'border-amber-400 bg-amber-50' : ''}">
                        <div class="absolute -top-1 -right-1 opacity-5 text-4xl">
                            ${t.id % 2 === 0 ? '<i class="fas fa-diamond"></i>' : '<i class="fas fa-club"></i>'}
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest">${t.name}</p>
                        <p class="text-4xl font-black ${isWarning ? 'text-amber-600' : 'text-slate-800'}">${t.score}</p>
                    </div>`;
                select.innerHTML += `<option value="${t.id}" ${currentSelect == t.id ? 'selected' : ''}>${t.name}</option>`;
            });
            updateLabels();
            checkWinner();
        }

        function updateOppTarget() {
            const val = document.getElementById('bid-type').value;
            document.getElementById('opp-target-box').innerText = (val == '13') ? '০ পয়েন্ট' : '৪ পয়েন্ট';
        }

        function updateLabels() {
            const bidder = teams[document.getElementById('bidder-select').value];
            document.getElementById('bidder-label').innerHTML = `<i class="fas fa-crown text-amber-500 mr-1"></i> ${bidder.name} (বিডার)`;
        }

        function setResult(side, status) {
            if(side === 'bidder') {
                bSuccess = status;
                document.getElementById('b-win').className = status ? 'flex-1 py-4 rounded-2xl active-win font-bold' : 'flex-1 py-4 rounded-2xl bg-white border border-slate-200 text-emerald-600 font-bold';
                document.getElementById('b-loss').className = !status ? 'flex-1 py-4 rounded-2xl active-loss font-bold' : 'flex-1 py-4 rounded-2xl bg-white border border-slate-200 text-rose-600 font-bold';
            } else {
                oSuccess = status;
                document.getElementById('o-win').className = status ? 'flex-1 py-4 rounded-2xl active-win font-bold' : 'flex-1 py-4 rounded-2xl bg-white border border-slate-200 text-emerald-600 font-bold';
                document.getElementById('o-loss').className = !status ? 'flex-1 py-4 rounded-2xl active-loss font-bold' : 'flex-1 py-4 rounded-2xl bg-white border border-slate-200 text-rose-600 font-bold';
            }
        }

        function submitScores() {
            if (bSuccess === null || oSuccess === null) return alert("উভয় পক্ষের রেজাল্ট সিলেক্ট করুন!");

            const bidderId = parseInt(document.getElementById('bidder-select').value);
            const bidVal = parseInt(document.getElementById('bid-type').value);
            const isGolden = bidVal === 13;
            const oppVal = isGolden ? 0 : 4;

            let bPt = isGolden ? (bSuccess ? 13 : -10) : (bSuccess ? bidVal : -bidVal);
            let oPt = isGolden ? (bSuccess ? 0 : 4) : (oSuccess ? oppVal : -oppVal);

            teams[bidderId].score += bPt;
            teams.forEach((t, i) => { if(i !== bidderId) t.score += oPt; });

            addHistory(teams[bidderId].name, bidVal, bPt, oPt);
            
            bSuccess = null; oSuccess = null;
            roundNo++;
            document.getElementById('round-indicator').innerText = `ROUND ${roundNo}`;
            document.querySelectorAll('.active-win, .active-loss').forEach(b => {
                b.className = "flex-1 py-4 rounded-2xl bg-white border border-slate-200 font-bold text-slate-400";
            });
            refresh();
        }

        function addHistory(bName, bVal, bPt, oPt) {
            const log = document.getElementById('history-log');
            const pointsList = teams.map(t => `<div class="flex justify-between py-1 border-b border-slate-50 last:border-0"><span>${t.name}</span><span class="font-black">${t.score}</span></div>`).join('');
            
            const row = `
                <tr class="hover:bg-slate-50 transition">
                    <td class="px-6 py-6 font-bold text-slate-400 text-xs tracking-widest">#${roundNo}</td>
                    <td class="px-6 py-6">
                        <span class="font-bold text-slate-700">${bName}</span>
                        <div class="text-[9px] font-black text-blue-600 uppercase">বিড: ${bVal}</div>
                    </td>
                    <td class="px-6 py-6">
                        <div class="${bPt>=0?'text-emerald-600':'text-rose-600'} font-black text-xs">বিডার: ${bPt>=0?'+'+bPt:bPt}</div>
                        <div class="${oPt>=0?'text-emerald-600':'text-rose-600'} text-[10px] font-bold opacity-70">বিপক্ষ: ${oPt>=0?'+'+oPt:oPt}</div>
                    </td>
                    <td class="px-6 py-6 bg-blue-50/30 text-[10px] min-w-[120px]">${pointsList}</td>
                </tr>`;
            log.innerHTML = row + log.innerHTML;
        }

        function checkWinner() {
            const winner = teams.find(t => t.score >= 50);
            if (winner) {
                document.getElementById('winner-name').innerText = winner.name + " জিতেছে!";
                document.getElementById('winner-modal').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
